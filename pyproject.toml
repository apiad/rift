[project]
name = "rift"
version = "0.1.0"
description = "Documentation linter — checks that docs reflect codebase reality"
requires-python = ">=3.11"
dependencies = [
    "click>=8",
    "pyyaml>=6",
    "rich>=13",
]

[project.scripts]
rift = "rift.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rift"]
